name: Build C# Project

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: build-csharp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build solution
      run: |
        dotnet build ./1.7/Source/BernaelXenotype.slnx -c Release

    - name: Upload assembly
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          ./1.7/Assemblies/BernaelSoul.dll
          ./1.7/Assemblies/BernaelVanquish.dll
          ./1.7/Assemblies/BernaelXenotype.dll

    - name: Commit rebuilt assembly
      if: |
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip ci]')
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -- ./1.7/Assemblies/BernaelSoul.dll \
          ./1.7/Assemblies/BernaelVanquish.dll \
          ./1.7/Assemblies/BernaelXenotype.dll

        if git diff --cached --quiet; then
          echo "Assembly unchanged, nothing to commit."
          exit 0
        fi

        git commit -m "chore(assemblies): rebuild 1.7 assemblies [skip ci]"
        git pull --rebase origin "$BRANCH"
        git push origin HEAD:"$BRANCH"

    - name: Resolve game version
      id: version
      run: |
        VERSION=$(python3 -c "import xml.etree.ElementTree as ET;r=ET.parse('About/About.xml').getroot();n=r.find('supportedVersions');v=[x.text.strip() for x in n.findall('li') if x.text and x.text.strip()] if n is not None else [];print('-'.join(v) if v else '1.7')")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "zip=BernaelXenotype-${VERSION}-$(git rev-parse --short HEAD).zip" >> "$GITHUB_OUTPUT"

    - name: Stage game files
      run: |
        python3 - <<'PY'
        import fnmatch
        from pathlib import Path
        import shutil
        import subprocess

        required = (
            'LoadFolders.xml',
            'About/About.xml',
            '1.7/Assemblies/BernaelSoul.dll',
            '1.7/Assemblies/BernaelVanquish.dll',
            '1.7/Assemblies/BernaelXenotype.dll',
        )
        patterns = required + (
            'About/*.png',
            'Common/Languages/*.xml',
            'Common/Sounds/*.wav',
            'Common/Sounds/*.ogg',
            'Common/Textures/*.png',
            '1.7/Defs/*.xml',
            '1.7/Languages/*.xml',
            '1.7/Nephilim/Patches/*.xml',
            '1.7/Patches/*.xml',
            '1.7/Shaders/*.glsl',
            '1.7/Textures/*.png',
        )
        tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
        selected = [name for name in tracked if any(fnmatch.fnmatchcase(name, pattern) for pattern in patterns)]
        missing = set(required) - set(selected)
        if missing:
            raise SystemExit('Missing game files: ' + ', '.join(sorted(missing)))
        for name in selected:
            target = Path('artifact') / name
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(name, target)
        print(f'Staged {len(selected)} game files.')
        PY

    - name: Zip whole mod
      run: |
        cd artifact
        zip -qr "../${{ steps.version.outputs.zip }}" .
        cd ..
        unzip -l "${{ steps.version.outputs.zip }}" | tail -5

    - name: Upload whole-mod zip
      uses: actions/upload-artifact@v4
      with:
        name: BernaelXenotype-mod
        path: ${{ steps.version.outputs.zip }}
        if-no-files-found: error

    - name: Find existing bot comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      id: bot_comment
      uses: peter-evans/find-comment@v3
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: github-actions[bot]
        body-includes: Bernael Xenotype dev build

    - name: Comment mod zip link on PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        comment-id: ${{ steps.bot_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        edit-mode: replace
        body: |
          ### Bernael Xenotype dev build

          🔗 **[Download the whole mod (zip)](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})** — artifact `BernaelXenotype-mod` → `${{ steps.version.outputs.zip }}`

          Built from `${{ github.event.pull_request.head_sha }}` against RimWorld `${{ steps.version.outputs.version }}`.

          Unzip straight into your RimWorld `Mods/` folder. The archive contains `About/`, `Common/`, `1.7/` and the three freshly compiled assemblies.

          <sub>Updated automatically on every push to this PR.</sub>
